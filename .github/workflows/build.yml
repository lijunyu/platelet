name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-mac-arm64:
    runs-on: macos-14
    env:
      # 无开发者证书,跳过自动代码签名(未签名包需用户右键打开或手动绕过 Gatekeeper)
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Package (arm64)
        run: yarn dist --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: platelet-mac-arm64
          path: |
            build/*.dmg
            build/*.zip
            build/latest-mac.yml

  build-win-x64:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Package (Windows x64)
        run: yarn dist --win --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: platelet-win-x64
          path: |
            build/*.exe
            build/*.blockmap
            build/latest.yml

  release:
    needs: [build-mac-arm64, build-win-x64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: platelet-mac-arm64
          path: dist/mac

      - name: Download win artifacts
        uses: actions/download-artifact@v4
        with:
          name: platelet-win-x64
          path: dist/win

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mac/*.dmg
            dist/mac/*.zip
            dist/mac/latest-mac.yml
            dist/win/*.exe
            dist/win/*.blockmap
            dist/win/latest.yml
